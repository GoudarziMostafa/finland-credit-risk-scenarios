[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finland-credit-risk-scenarios"
version = "0.1.0"
description = "Transparent credit-loss scenarios using public Finnish aggregate data"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
notebook = ["nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6.29,<8"]

[tool.setuptools.packages.find]
where = ["src"]
